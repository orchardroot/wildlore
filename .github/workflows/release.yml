name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .godot-bin
            ~/.local/share/godot/export_templates
          key: godot-export-${{ hashFiles('tools/get_godot.sh') }}
      - name: Tests
        run: tools/test.sh
      - name: Export
        run: tools/export.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          build/Wildlore-mac.zip build/Wildlore-windows.zip
          --title "Wildlore: These Isles $GITHUB_REF_NAME"
          --notes "Unsigned builds. Mac: right-click Wildlore.app, Open. Windows: More info, Run anyway."
          --prerelease
